name: Build and Release FOSS Flavor

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_FOSS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > tidy-foss-ci.jks

      - name: Configure Keystore Properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_FOSS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_FOSS_KEY_ALIAS }}
        run: |
          # Fail fast rather than let app/build.gradle.kts silently fall back to
          # debug signing when a secret is missing/misconfigured (see signingConfigs
          # in app/build.gradle.kts) — that fallback exists for local dev convenience
          # only and must never be reachable in a release build.
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_FOSS_KEYSTORE_PASSWORD or ANDROID_FOSS_KEY_ALIAS secret is empty. Refusing to build a release artifact that could silently fall back to debug signing." >&2
            exit 1
          fi
          cat <<EOF > keystore.properties
          fossStoreFile=$(pwd)/tidy-foss-ci.jks
          fossPassword=$KEYSTORE_PASSWORD
          fossKeyAlias=$KEY_ALIAS
          EOF

      - name: Run Unit Tests
        run: ./gradlew testFossDebugUnitTest :shared:testAndroidHostTest

      - name: Build FOSS Release APK
        run: ./gradlew assembleFossRelease

      - name: Verify Release Signing
        run: |
          APKSIGNER=$(find "$ANDROID_HOME"/build-tools -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/foss/release -name "Tidy-foss-v*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No FOSS release APK found to verify." >&2
            exit 1
          fi
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::$APK is signed with the Android debug certificate, not the release key. Aborting publish." >&2
            exit 1
          fi

      - name: Extract Changelog Section
        id: extract_changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "Extracting release notes for version: $VERSION"
          
          python3 -c "
          import sys
          version = '$VERSION'
          lines = []
          recording = False
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              for line in f:
                  if line.startswith('## '):
                      if f'[{version}]' in line:
                          recording = True
                          continue
                      elif recording:
                          break
                  if recording:
                      lines.append(line)
          if not lines:
              print(f'Error: No changelog section found for version {version}', file=sys.stderr)
              sys.exit(1)
          content = ''.join(lines).strip()
          with open('release_notes.txt', 'w', encoding='utf-8') as rf:
              rf.write(content)
          "
          echo "notes_file=release_notes.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.txt
          files: app/build/outputs/apk/foss/release/Tidy-foss-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keystores
        if: always()
        run: |
          rm -f tidy-foss-ci.jks
          rm -f keystore.properties
          rm -f release_notes.txt
