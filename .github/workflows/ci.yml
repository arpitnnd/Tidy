name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:

jobs:
  verify:
    name: Unit Tests & Lint (foss)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run unit tests
        run: ./gradlew testFossDebugUnitTest :shared:testAndroidHostTest

      - name: Run lint
        run: ./gradlew lintFossDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            shared/build/reports/tests
            app/build/reports/lint-results-fossDebug.html
